# autorestic - High-level CLI backup tool wrapper for restic
# Note: autorestic is a CLI tool, not a web service.
# This container runs automated backups on a schedule.

name: autorestic
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  autorestic:
    image: cupcakearmy/autorestic:latest
    pull_policy: always
    container_name: autorestic-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - autorestic
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: autorestic-app
    volumes:
      - ./volumes/config/autorestic:/root/.autorestic
      - ./volumes/data/autorestic:/backup

networks:
  autorestic:
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
